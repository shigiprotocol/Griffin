name: Build Griffin APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish the APKs as a GitHub release with this tag (leave empty to only build)"
        required: false
        type: string
  push:
    branches:
      - my-releases
      - master
      - griffin
    paths-ignore:
      - "**.md"
      - "fastlane/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "30.0.16248370"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh

    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Stage the native libraries
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "Current tag in this repo: $CURRENT_TAG"
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: 'patterniha/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v6.1.0
      with:
        distribution: 'temurin'
        java-version: '21'

    # Without the APP_KEYSTORE_* secrets the APKs are signed with a key kept in the Actions cache under a fixed
    # name, so that one build installs over the one before. Add the secrets to sign with a key of your own for good.
    - name: Restore the fallback signing key
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/fallback-signing.jks
        key: griffin-fallback-signing-key-v1

    - name: Set up the signing key
      env:
        APP_KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
        APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
        APP_KEYSTORE_ALIAS: ${{ secrets.APP_KEYSTORE_ALIAS }}
        APP_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
      run: |
        if [ -n "$APP_KEYSTORE_BASE64" ]; then
          printf '%s' "$APP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGN_STORE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
          echo "SIGN_STORE_PASS=$APP_KEYSTORE_PASSWORD" >> $GITHUB_ENV
          echo "SIGN_ALIAS=$APP_KEYSTORE_ALIAS" >> $GITHUB_ENV
          echo "SIGN_KEY_PASS=$APP_KEY_PASSWORD" >> $GITHUB_ENV
          echo "Signing with the key of the APP_KEYSTORE_* secrets"
        else
          if [ ! -f fallback-signing.jks ]; then
            keytool -genkeypair -v -keystore fallback-signing.jks -storepass griffin -keypass griffin \
              -alias griffin -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=Griffin, O=shigiprotocol"
            echo "FALLBACK_KEY_CREATED=true" >> $GITHUB_ENV
          fi
          echo "SIGN_STORE=${{ github.workspace }}/fallback-signing.jks" >> $GITHUB_ENV
          echo "SIGN_STORE_PASS=griffin" >> $GITHUB_ENV
          echo "SIGN_ALIAS=griffin" >> $GITHUB_ENV
          echo "SIGN_KEY_PASS=griffin" >> $GITHUB_ENV
          echo "::warning::APP_KEYSTORE_* secrets are not set; the APKs are signed with the fallback key from the Actions cache"
        fi

    - name: Save the fallback signing key
      if: env.FALLBACK_KEY_CREATED == 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/fallback-signing.jks
        key: griffin-fallback-signing-key-v1

    - name: Build APK
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        set -o pipefail
        # The JVM unit tests are the only automated check of the Kotlin logic; a failure stops the
        # build before anything is assembled or signed.
        ./gradlew :app:testPlaystoreDebugUnitTest 2>&1 | tee -a gradle.log
        ./gradlew licenseFdroidReleaseReport 2>&1 | tee -a gradle.log
        ./gradlew assembleRelease -PpattngVersion="${{ inputs.release_tag }}" \
          -Pandroid.injected.signing.store.file="$SIGN_STORE" \
          -Pandroid.injected.signing.store.password="$SIGN_STORE_PASS" \
          -Pandroid.injected.signing.key.alias="$SIGN_ALIAS" \
          -Pandroid.injected.signing.key.password="$SIGN_KEY_PASS" 2>&1 | tee -a gradle.log

    # Compiler and test failures as annotations, so they can be read on the run's page without its log.
    - name: Report build errors
      if: failure()
      run: |
        LOG=${{ github.workspace }}/V2rayNG/gradle.log
        [ -f "$LOG" ] || exit 0
        grep -E '^e: |error:|What went wrong|> Task .* FAILED|Execution failed|FAILED$|Test.*FAILED|AssertionFailedError|Exception at|expected:|Lint found' "$LOG" | head -60 | while IFS= read -r line; do
          echo "::error::$line"
        done
        for f in ${{ github.workspace }}/V2rayNG/app/build/test-results/*/TEST-*.xml; do
          [ -f "$f" ] || continue
          python3 - "$f" <<'PY'
        import sys, xml.etree.ElementTree as ET
        for case in ET.parse(sys.argv[1]).getroot().iter('testcase'):
            for failure in list(case.findall('failure')) + list(case.findall('error')):
                msg = (failure.get('message') or '').replace('\n', ' ')[:300]
                print(f"::error title=Test {case.get('classname')}.{case.get('name')}::{msg}")
        PY
        done

    - name: Check the native libraries in the APKs
      run: |
        # Looked into as ZIP files: every ABI an APK carries has to bring Xray and both HEV builds.
        status=0
        for apk in ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*.apk; do
          entries=$(unzip -Z1 "$apk" | grep '^lib/' || true)
          echo "$(basename "$apk"):"
          echo "$entries" | sed 's/^/  /'
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            echo "$entries" | grep -q "^lib/$abi/" || continue
            for lib in libgojni.so libhev-socks5-tunnel.so libhevsockstun.so; do
              if ! echo "$entries" | grep -qx "lib/$abi/$lib"; then
                echo "::error::$(basename "$apk") lacks lib/$abi/$lib"
                status=1
              fi
            done
          done
        done
        exit $status

    - name: Verify the APK signatures
      run: |
        BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
        for apk in ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*.apk; do
          n=$(basename "$apk")
          pkg=$($BT/aapt2 dump badging "$apk" | head -1)
          cert=$($BT/apksigner verify --print-certs "$apk" | grep -m1 "SHA-256 digest" || true)
          echo "::notice title=$n::$pkg | $cert"
        done

    - name: Upload arm64-v8a APK
      uses: actions/upload-artifact@v7
      if: ${{  success() }}
      with:
        name: Griffin-arm64-v8a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*arm64-v8a*.apk

    - name: Upload armeabi-v7a APK
      uses: actions/upload-artifact@v7
      if: ${{  success() }}
      with:
        name: Griffin-armeabi-v7a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*armeabi-v7a*.apk

    - name: Upload x86 APK
      uses: actions/upload-artifact@v7
      if: ${{  success() }}
      with:
        name: Griffin-x86
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*x86*.apk

    - name: Upload universal APK
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: Griffin-universal
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*universal*.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          path: release

      - name: Collect the APKs
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          mkdir -p release-files
          find release -type f -name '*.apk' -exec cp {} release-files/ \;
          # Detached signatures only when a GPG key is set as a secret.
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            # Quiet: a plain import prints the key's user ID, name and email, into the public log.
            printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
            KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
            for apk in release-files/*.apk; do
              gpg --batch --yes --local-user "$KEY" --detach-sign --output "$apk.sig" "$apk"
            done
            gpg --armor --export "$KEY" > release-files/Griffin-public-key.asc
          fi

      - name: Upload APKs to the release
        uses: svenstaro/upload-release-action@v2
        with:
          file: release-files/*
          tag: ${{ inputs.release_tag }}
          release_name: Griffin v${{ inputs.release_tag }}
          body: "Griffin v${{ inputs.release_tag }}"
          target_commit: ${{ github.sha }}
          file_glob: true
          prerelease: false
          overwrite: true
